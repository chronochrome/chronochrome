name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: ESLint
        run: pnpm lint
      - name: Prettier
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Publint
        run: pnpm publint
      - name: Demo build
        run: pnpm build:demo
      - name: Inspect tarballs
        run: |
          mkdir -p /tmp/tarballs
          pnpm -r --filter './packages/*' exec pnpm pack --pack-destination /tmp/tarballs
          for t in /tmp/tarballs/*.tgz; do echo "== $t"; tar -tzf "$t"; done

  test:
    name: Test (Node ${{ matrix.node }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Smoke import (ESM)
        working-directory: packages/core
        run: |
          node --input-type=module -e "
            import { sampleLightHue } from './dist/index.js';
            const s = sampleLightHue({ hourOverride: 12, season: 'summer' });
            if (!s.accent.hex.startsWith('#')) throw new Error('bad accent');
            console.log('ok', s.phaseLabel, s.accent.hex);
          "
