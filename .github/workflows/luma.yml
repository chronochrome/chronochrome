name: Deploy demo (Luma)

on:
  push:
    branches: [main, master]
    paths:
      - "apps/demo/**"
      - "packages/core/src/**"
      - "packages/widget/src/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/luma.yml"
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Luma
    runs-on: ubuntu-latest
    environment: luma
    steps:
      - uses: actions/checkout@v4
      - name: Install deploy key
        env:
          LUMA_SSH_KEY: ${{ secrets.LUMA_SSH_KEY }}
        run: |
          if [ -z "$LUMA_SSH_KEY" ]; then
            echo "LUMA_SSH_KEY is empty. Set it on the luma environment." >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$LUMA_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          cp apps/demo/deploy/known_hosts ~/.ssh/known_hosts
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build demo
        run: |
          pnpm install --frozen-lockfile
          pnpm build:demo
      - name: Rsync to Luma
        env:
          SKIP_BUILD: "1"
        run: bash apps/demo/deploy/deploy.sh
